name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag do release (ex: v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # whisper-rs-sys uses bindgen, which needs libclang.dll to parse wrapper.h.
      # windows-latest ships LLVM (with libclang.dll in C:\Program Files\LLVM\bin),
      # so prefer that. Fall back to the PyPI clang wheel if LLVM is missing.
      - name: Configure libclang and CMake
        shell: pwsh
        run: |
          $libclang = "C:\Program Files\LLVM\bin\libclang.dll"
          if (-not (Test-Path $libclang)) {
            python -m pip install --upgrade pip
            python -m pip install clang
            $native = python -c "import clang, os; print(os.path.join(os.path.dirname(clang.__file__), 'native'))"
            if (Test-Path (Join-Path $native "libclang.dll")) {
              $libclang = Join-Path $native "libclang.dll"
            }
          }
          if (-not (Test-Path $libclang)) {
            throw "libclang.dll not found (checked LLVM and the clang Python wheel)"
          }
          "LIBCLANG_PATH=$(Split-Path $libclang)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "LIBCLANG_PATH=$(Split-Path $libclang)"

          # The cmake crate accepts CMAKE with the full executable path.
          $cmakeCmd = Get-Command cmake -ErrorAction SilentlyContinue
          if ($cmakeCmd) {
            $cmake = $cmakeCmd.Source
          } elseif (Test-Path "C:\Program Files\CMake\bin\cmake.exe") {
            $cmake = "C:\Program Files\CMake\bin\cmake.exe"
          } else {
            throw "cmake executable not found"
          }
          "CMAKE=$cmake" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "CMAKE=$cmake"

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          repo: FantonioMotta/HelpToDesktop
          tagName: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          releaseName: "HelpBar Desktop ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          releaseBody: "Atualização automática disponível via GitHub Releases."
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
          includeUpdaterJson: true
