# Global compiler/build settings for the HelpBar workspace.
#
# whisper.cpp (compiled by whisper-rs-sys through the `cmake` crate) drops the
# default MSVC release flags, which makes the release binary run ~10x slower
# (~0.2x realtime instead of ~2x realtime). Forcing the optimization flags back
# keeps transcription fast without touching bundled upstream sources.
[env]
CMAKE_C_FLAGS_RELEASE = "/O2 /Ob2 /DNDEBUG"
CMAKE_CXX_FLAGS_RELEASE = "/O2 /Ob2 /DNDEBUG"

# Toolchain do whisper.cpp. Ficam aqui (e não só no ambiente do shell) porque o
# Cargo injeta estas variáveis no build script mesmo quando o terminal/IDE foi
# aberto antes de elas serem definidas no registro do Windows.
# `force = false` respeita um valor já definido pelo usuário, se houver.
# Ajuste os caminhos abaixo ao trocar de máquina.
LIBCLANG_PATH = { value = "C:/Users/ADM/AppData/Roaming/Python/Python313/site-packages/clang/native", force = false }
CMAKE = { value = "C:/Users/ADM/Tools/cmake-3.31.6-windows-x86_64/bin/cmake.exe", force = false }
